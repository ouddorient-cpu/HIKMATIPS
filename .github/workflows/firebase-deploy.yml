name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_GENAI_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_GENAI_API_KEY }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: studio-5790524114-6339d.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: studio-5790524114-6339d
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:170365007214:web:fa9ea9040cb5d306c23d7f
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "170365007214"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: studio-5790524114-6339d
          channelId: live
